<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Eval Pipeline — Mustafa Sadree</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1a14; color: #e8f5f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .container { width: 100%; max-width: 780px; }
  .header { margin-bottom: 1.5rem; }
  .back-link { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #5DCAA5; text-decoration: none; padding: 6px 12px; border: 1px solid #1d9e7530; border-radius: 6px; margin-bottom: 1rem; transition: border-color 0.2s; }
  .back-link:hover { border-color: #1D9E75; }
  h1 { font-size: 20px; font-weight: 500; color: #fff; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #5DCAA5; opacity: 0.8; }
  .diagram-card { background: #0e2218; border: 1px solid #1d9e7520; border-radius: 12px; padding: 1.5rem; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #e8f5f0; }
  .ts { font-size: 12px; font-weight: 400; fill: #9FE1CB; }
  .arr { stroke: #5DCAA5; stroke-width: 1.5; fill: none; }
  .c-teal rect { fill: #112b1e; stroke: #1D9E75; }
  .c-teal .th { fill: #9FE1CB; }
  .c-teal .ts { fill: #5DCAA5; }
  .c-purple rect { fill: #1a1535; stroke: #7F77DD; }
  .c-purple .th { fill: #CECBF6; }
  .c-purple .ts { fill: #AFA9EC; }
  .c-gray rect { fill: #1a1f1c; stroke: #5F5E5A; }
  .c-gray .th { fill: #e8f5f0; }
  .c-gray .ts { fill: #9FE1CB; }
  .c-amber rect { fill: #1f1a0a; stroke: #BA7517; }
  .c-amber .th { fill: #FAC775; }
  .c-amber .ts { fill: #EF9F27; }
  .c-green rect { fill: #0f1f0a; stroke: #3B6D11; }
  .c-green .th { fill: #C0DD97; }
  .c-green .ts { fill: #97C459; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <a class="back-link" href="https://mustafa-ai-agents.netlify.app"><i class="ti ti-arrow-left"></i> Portfolio</a>
    <h1>RAG eval pipeline</h1>
    <div class="sub">How the bring-your-own-data agent measures answer quality</div>
  </div>
  <div class="diagram-card">
    <svg width="100%" viewBox="0 0 680 540" role="img">
      <title>RAG eval pipeline diagram</title>
      <desc>Flowchart showing how the eval system works from document upload through chunking, embedding, retrieval, answer generation, keyword scoring and accuracy reporting.</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <g class="c-gray">
        <rect x="240" y="20" width="200" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Document upload</text>
        <text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">PDF, TXT, CSV</text>
      </g>

      <line x1="340" y1="72" x2="185" y2="104" stroke="#5DCAA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <line x1="340" y1="72" x2="340" y2="104" stroke="#5DCAA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

      <g class="c-teal">
        <rect x="100" y="104" width="170" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="185" y="124" text-anchor="middle" dominant-baseline="central">Chunk text</text>
        <text class="ts" x="185" y="141" text-anchor="middle" dominant-baseline="central">150 words, 30 overlap</text>
      </g>

      <g class="c-teal">
        <rect x="410" y="104" width="170" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="495" y="124" text-anchor="middle" dominant-baseline="central">Embed chunks</text>
        <text class="ts" x="495" y="141" text-anchor="middle" dominant-baseline="central">all-MiniLM-L6-v2</text>
      </g>

      <line x1="270" y1="130" x2="410" y2="130" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <line x1="495" y1="156" x2="495" y2="188" stroke="#5DCAA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

      <g class="c-teal">
        <rect x="410" y="188" width="170" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="495" y="208" text-anchor="middle" dominant-baseline="central">Store in ChromaDB</text>
        <text class="ts" x="495" y="225" text-anchor="middle" dominant-baseline="central">Vector index ready</text>
      </g>

      <g class="c-purple">
        <rect x="40" y="188" width="180" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="130" y="208" text-anchor="middle" dominant-baseline="central">Eval questions</text>
        <text class="ts" x="130" y="225" text-anchor="middle" dominant-baseline="central">Q + expected keywords</text>
      </g>

      <line x1="130" y1="240" x2="130" y2="300" stroke="#7F77DD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <line x1="495" y1="240" x2="495" y2="300" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

      <g class="c-teal">
        <rect x="270" y="300" width="200" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="370" y="320" text-anchor="middle" dominant-baseline="central">Retrieve top chunks</text>
        <text class="ts" x="370" y="337" text-anchor="middle" dominant-baseline="central">Embed Q, cosine search</text>
      </g>

      <line x1="130" y1="300" x2="270" y2="326" stroke="#7F77DD" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <line x1="495" y1="300" x2="470" y2="326" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <line x1="370" y1="352" x2="370" y2="384" stroke="#5DCAA5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

      <g class="c-purple">
        <rect x="270" y="384" width="200" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="370" y="404" text-anchor="middle" dominant-baseline="central">Generate answer</text>
        <text class="ts" x="370" y="421" text-anchor="middle" dominant-baseline="central">Claude, grounded only</text>
      </g>

      <line x1="370" y1="436" x2="320" y2="468" stroke="#BA7517" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
      <line x1="370" y1="436" x2="450" y2="468" stroke="#3B6D11" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

      <g class="c-amber">
        <rect x="180" y="468" width="180" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="270" y="488" text-anchor="middle" dominant-baseline="central">Keyword scoring</text>
        <text class="ts" x="270" y="505" text-anchor="middle" dominant-baseline="central">Hits / expected = score</text>
      </g>

      <g class="c-green">
        <rect x="400" y="468" width="170" height="52" rx="8" stroke-width="0.5"/>
        <text class="th" x="485" y="488" text-anchor="middle" dominant-baseline="central">Accuracy report</text>
        <text class="ts" x="485" y="505" text-anchor="middle" dominant-baseline="central">Pass rate, per-Q result</text>
      </g>

      <rect x="40" y="468" width="10" height="10" rx="2" fill="#1D9E75"/>
      <text class="ts" x="56" y="477" dominant-baseline="central">RAG pipeline</text>
      <rect x="40" y="488" width="10" height="10" rx="2" fill="#7F77DD"/>
      <text class="ts" x="56" y="497" dominant-baseline="central">Eval input</text>
      <rect x="40" y="508" width="10" height="10" rx="2" fill="#BA7517"/>
      <text class="ts" x="56" y="517" dominant-baseline="central">Scoring</text>
    </svg>
  </div>
</div>
</body>
</html>
